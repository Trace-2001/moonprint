[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birthday-moon"
version = "1.0.0"
description = "把农历生日渲染成出生当天真实月相的图（NASA 月球贴图 + 真实星历）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pillow>=8.0",
    "ephem>=4.1",
    "zhdate>=0.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
moonbirthday = "moonbirthday.cli:main"

[tool.setuptools.packages.find]
include = ["moonbirthday*"]

# 前端网页资源随包分发（HTML/CSS/JS/背景图/logo）
[tool.setuptools.package-data]
moonbirthday = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]

# NASA 贴图（textures/）不随包分发，首次运行自动下载到 ~/.moonprint/textures/
